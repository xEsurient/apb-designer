name: Sync APBDb Data
on:
  schedule:
    - cron: '0 20 * * 3'
  workflow_dispatch:
jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run Sync Script
        run: node scripts/sync.js
        
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update APBDb localization data"
          title: "Automated APBDb Data Sync"
          body: "This PR contains updated localization data pulled directly from the APBDb REST API."
          branch: "update-apbdb-data"
          base: "main"
