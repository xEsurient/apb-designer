name: APBDb Sync
on:
  schedule:
    - cron: '0 20 * * 3'
  workflow_dispatch:
jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Run Sync Script
        run: node scripts/sync.js
        
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "😞 chore: update APBDb data"
          title: "🤓 APBDb Sync"
          body: "Workflow automated update, APBDb data updated."
          branch: "update-apbdb-data"
          base: "main"
